<script>
  const API = (window.location.protocol === 'file:' || window.location.origin === 'null')
    ? 'http://127.0.0.1:8000'
    : window.location.origin;
  let isLoading = false;
  let conversationHistory = [];

  const _qs = new URLSearchParams(window.location.search);
  const _urlKey = _qs.get('key') || _qs.get('api_key');
  const API_KEY = _urlKey || localStorage.getItem('justclick_api_key') || '';
  if (_urlKey) {
    localStorage.setItem('justclick_api_key', _urlKey);
    _qs.delete('key'); _qs.delete('api_key');                 // do not leave the key in the address bar / history
    const _rest = _qs.toString();
    history.replaceState(null, '', window.location.pathname + (_rest ? '?' + _rest : ''));
  }

  // Company and fiscal year every question is asked for: ?company=60&year=2025 (remembered), else the
  // server's DEFAULT_COMPANY_CODE / DEFAULT_FISCAL_YEAR (GET /chat/config).
  const SCOPE = {
    company_code: _qs.get('company') || localStorage.getItem('justclick_company') || '',
    fiscal_year: _qs.get('year') || localStorage.getItem('justclick_year') || '',
  };
  if (_qs.get('company')) localStorage.setItem('justclick_company', SCOPE.company_code);
  if (_qs.get('year')) localStorage.setItem('justclick_year', SCOPE.fiscal_year);

  function scopeBody() {
    return {
      company_code: SCOPE.company_code || '1',
      fiscal_year: SCOPE.fiscal_year || String(new Date().getFullYear()),
    };
  }

  function showScope() {
    const el = document.getElementById('scope-label');
    if (el) el.textContent = 'الشركة ' + (SCOPE.company_code || '؟') + ' · ' + (SCOPE.fiscal_year || '؟');
  }

  async function loadScopeDefaults() {
    try {
      const r = await fetch(API + '/chat/config', { headers: apiHeaders() });
      if (r.ok) {
        const cfg = await r.json();
        if (!SCOPE.company_code) SCOPE.company_code = String(cfg.company_code || '');
        if (!SCOPE.fiscal_year) SCOPE.fiscal_year = String(cfg.fiscal_year || '');
      }
    } catch (e) { /* the fallbacks of scopeBody() apply */ }
    showScope();
  }

  function editScope() {
    const company = prompt('كود الشركة', SCOPE.company_code || '');
    if (company === null) return;
    const year = prompt('السنة المالية', SCOPE.fiscal_year || '');
    if (year === null) return;
    SCOPE.company_code = company.trim();
    SCOPE.fiscal_year = year.trim();
    localStorage.setItem('justclick_company', SCOPE.company_code);
    localStorage.setItem('justclick_year', SCOPE.fiscal_year);
    showScope();
  }

  function apiHeaders() {
    const h = { 'Content-Type': 'application/json' };
    if (API_KEY) h['X-API-Key'] = API_KEY;
    return h;
  }

  // ══════════════════════════════════════════════════════════════
  // ICONS
  // ══════════════════════════════════════════════════════════════
  const KPI_ICONS = {
    currency: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>',
    trending: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>',
    'check-circle': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    'x-circle': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    percent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>',
  };

  const CHIP_ICONS = {
    chart: '📊', compare: '📈', branch: '🏢', ranking: '🏆', trend: '📉',
    alert: '⚠️', finance: '💰', detail: '🔍', dashboard: '📋', tree: '🌳',
    balance: '⚖️', movement: '🔄', new: '✨', summary: '📝', suggest: '💡',
    export: '📥', predict: '🔮', workflow: '⚡',
  };

  const INSIGHT_ICONS = {
    'trending-up': '📈', 'trending-down': '📉', alert: '⚠️',
    info: '💡', variance: '📊', positive: '✅', warning: '⚡',
  };

  // Thinking phase messages for live copilot feeling
  const THINKING_PHASES = [
    'يحلل سؤالك',
    'يبحث في البيانات',
    'يُعد التحليل',
    'يصيغ الإجابة',
  ];

  // ══════════════════════════════════════════════════════════════
  // CHAT
  // ══════════════════════════════════════════════════════════════
  function now() {
    return new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  }

  function methodBadge(method, template) {
    if (!method) return '';
    if (method === 'template') return '<span class="method-badge template">Template</span>';
    if (method === 'llm_controlled') return '<span class="method-badge llm">AI</span>';
    if (method === 'greeting' || method === 'help') return '';
    if (method === 'dashboard') return '<span class="method-badge dashboard">Dashboard</span>';
    if (method === 'action') return '<span class="method-badge action">Action</span>';
    if (method === 'workflow') return '<span class="method-badge workflow">Workflow</span>';
    if (method === 'report') return '<span class="method-badge report">Report</span>';
    if (method === 'navigation') return '<span class="method-badge navigation">Navigate</span>';
    return '';
  }

  function removeEmpty() { document.getElementById('empty-state')?.remove(); }

  function appendUser(text) {
    removeEmpty();
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.innerHTML = '<div class="msg-user">' + escHtml(text) + '</div>';
    document.getElementById('chat-area').appendChild(row);
    scrollBottom();
  }

  function appendBot(answer, sql, rowCount, method, templateUsed, execTime, chartData, widgets, suggestions, insights, actionCard, navLinks, exportAvailable, reportData) {
    const uid = 'sql_' + Date.now();
    const chartId = 'cc_' + Date.now();
    const hasWidgets = widgets && widgets.length > 0;
    const row = document.createElement('div');
    row.className = 'msg-row';

    // Meta
    const metaParts = ['<span class="msg-time">' + now() + '</span>'];
    if (rowCount > 0) metaParts.push('<span class="msg-rows">' + rowCount + ' نتيجة</span>');
    const badge = methodBadge(method, templateUsed);
    if (badge) metaParts.push(badge);
    if (execTime > 0) metaParts.push('<span class="msg-exec-time">' + execTime + 'ms</span>');

    // SQL section
    const hasSql = sql && sql.trim().length > 0;
    const sqlSection = hasSql ? (
      '<button class="sql-toggle" onclick="toggleSql(\'' + uid + '\', this)" aria-expanded="false">' +
        '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>' +
        'SQL' +
      '</button>' +
      '<div class="sql-block" id="' + uid + '">' +
        '<div class="sql-header"><span>SQL</span><button class="copy-btn" onclick="copySql(\'' + uid + '\')">نسخ</button></div>' +
        '<div class="sql-code">' + escHtml(sql) + '</div>' +
      '</div>'
    ) : '';

    // Standalone chart
    const chartSection = (chartData && !hasWidgets) ?
      '<div class="chat-chart-container"><canvas id="' + chartId + '"></canvas></div>' : '';

    // Inline widgets
    let widgetHtml = '';
    let pendingCharts = [];
    if (hasWidgets) {
      const wr = renderInlineWidgets(widgets);
      widgetHtml = wr.html;
      pendingCharts = wr.charts;
    }

    // ERP Operator: Action Card
    const actionHtml = renderActionCard(actionCard, method);

    // ERP Operator: Navigation Links
    const navHtml = renderNavLinks(navLinks);

    // ERP Operator: Export Available
    const exportHtml = renderExportAvailable(exportAvailable);

    // Insights
    const insightHtml = renderInsights(insights);

    // Suggestion chips
    const chipHtml = renderSuggestionChips(suggestions);

    // Rendered content with streaming class for animation
    const contentId = 'content_' + Date.now();

    row.innerHTML =
      '<div class="msg-bot' + (hasWidgets ? ' has-widgets' : '') + (actionCard ? ' has-action' : '') + '">' +
        '<div class="msg-bot-content" id="' + contentId + '">' + renderMarkdown(answer) + '</div>' +
        actionHtml +
        navHtml +
        widgetHtml +
        chartSection +
        exportHtml +
        insightHtml +
        '<div class="msg-meta">' + metaParts.join('') + sqlSection + '</div>' +
        chipHtml +
      '</div>';

    document.getElementById('chat-area').appendChild(row);

    // Staged reveal: content first, then charts, then insights animate in via CSS
    requestAnimationFrame(() => {
      pendingCharts.forEach(c => initChartOnCanvas(c.canvasId, c.data));
      if (chartData && !hasWidgets) renderChatChart(chartId, chartData);
      row.querySelectorAll('[data-kpi-target]').forEach(el => {
        animateKpiValue(el, parseFloat(el.dataset.kpiTarget), el.dataset.kpiFmt);
      });

      // Streaming text reveal effect for non-widget responses
      if (!hasWidgets && !actionCard && answer && answer.length > 50) {
        streamReveal(contentId);
      }
    });
    scrollBottom();
  }

  // Streaming text reveal — progressive word-by-word appearance
  function streamReveal(contentId) {
    const container = document.getElementById(contentId);
    if (!container) return;

    // Only apply to paragraph text nodes, not tables/cards
    const paragraphs = container.querySelectorAll('.md-p, .md-summary');
    if (paragraphs.length === 0) return;

    let wordDelay = 0;
    paragraphs.forEach(p => {
      const original = p.innerHTML;
      // Split by words but preserve HTML tags
      const parts = original.split(/(\s+)/);
      let rebuilt = '';
      parts.forEach(part => {
        if (part.trim() && !part.startsWith('<')) {
          rebuilt += '<span class="stream-word" style="animation-delay:' + wordDelay + 'ms">' + part + '</span>';
          wordDelay += 18;
        } else {
          rebuilt += part;
        }
      });
      p.innerHTML = rebuilt;
    });

    container.classList.add('streaming');
    // Remove streaming class after animation completes
    setTimeout(() => {
      container.classList.remove('streaming');
      paragraphs.forEach(p => {
        p.querySelectorAll('.stream-word').forEach(sw => {
          sw.style.opacity = '1';
          sw.style.animation = 'none';
        });
      });
    }, wordDelay + 200);
  }

  function appendError(msg) {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.innerHTML = '<div class="msg-error">' + escHtml(msg) + '</div>';
    document.getElementById('chat-area').appendChild(row);
    scrollBottom();
  }

  // Enhanced loading with thinking phases
  let thinkingInterval = null;
  function showLoading() {
    const el = document.createElement('div');
    el.id = 'loading-indicator';
    el.className = 'loading-indicator';
    el.innerHTML =
      '<div class="loading-avatar"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>' +
      '<div class="loading-content">' +
        '<span class="loading-text" id="thinking-text">' + THINKING_PHASES[0] + '</span>' +
        '<span class="loading-sub" id="thinking-sub">يعالج طلبك...</span>' +
      '</div>' +
      '<div class="loading-dots"><span></span><span></span><span></span></div>';
    document.getElementById('chat-area').appendChild(el);
    scrollBottom();

    // Cycle through thinking phases
    let phase = 0;
    thinkingInterval = setInterval(() => {
      phase = (phase + 1) % THINKING_PHASES.length;
      const textEl = document.getElementById('thinking-text');
      if (textEl) {
        textEl.style.opacity = '0';
        setTimeout(() => {
          if (textEl) {
            textEl.textContent = THINKING_PHASES[phase];
            textEl.style.opacity = '1';
          }
        }, 150);
      }
    }, 1800);
  }

  function removeLoading() {
    if (thinkingInterval) { clearInterval(thinkingInterval); thinkingInterval = null; }
    document.getElementById('loading-indicator')?.remove();
  }

  // ── SSE Streaming Mode ─────────────────────────────────────────
  const USE_STREAMING = true; // Enable real-time streaming

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('question-input');
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;
    isLoading = true;

    appendUser(question);

    if (USE_STREAMING) {
      await sendMessageSSE(question);
      return;
    }

    showLoading();

    try {
      const res = await fetch(API + '/chat/', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({
          question,
          ...scopeBody(),
          history: conversationHistory.slice(-10)
        })
      });

      const data = await res.json();
      removeLoading();

      if (!res.ok) {
        appendError(data.detail || 'حدث خطأ في السيرفر');
      } else {
        conversationHistory.push({ role: 'user', content: question });
        conversationHistory.push({
          role: 'assistant',
          content: data.sql_generated
            ? 'SQL: ' + data.sql_generated + '\n(' + data.row_count + ' rows)\n' + data.answer
            : data.answer
        });

        // Track pending action for confirmation flow
        if (data.action_id) {
          window._pendingActionId = data.action_id;
        } else {
          window._pendingActionId = null;
        }

        // Append proactive alerts HTML to greeting answers
        let displayAnswer = data.answer;
        if (data.proactive_alerts && data.proactive_alerts.length > 0) {
          displayAnswer += '\n' + renderProactiveAlerts(data.proactive_alerts);
        }
        appendBot(
          displayAnswer,
          data.sql_generated,
          data.row_count,
          data.method,
          data.template_used,
          data.execution_time_ms,
          data.chart_data,
          data.widgets,
          data.suggestions,
          data.insights,
          data.action_card,
          data.navigation_links,
          data.export_available,
          data.report_data
        );
      }
    } catch (err) {
      removeLoading();
      appendError('تعذّر الاتصال بالسيرفر');
    } finally {
      isLoading = false;
      document.getElementById('send-btn').disabled = false;
      input.focus();
    }
  }

  // ── SSE Streaming Client ─────────────────────────────────────────
  async function sendMessageSSE(question) {
    const chatBox = document.getElementById('chat-area');
    // Create streaming response container
    const row = document.createElement('div');
    row.className = 'msg-row bot-row';
    const stageId = 'sse_stage_' + Date.now();
    const contentId = 'sse_content_' + Date.now();
    row.innerHTML =
      '<div class="msg-bot">' +
        '<div class="sse-stages" id="' + stageId + '"><div class="sse-stage-item running"><span class="stage-icon">⟳</span> جاري المعالجة...</div></div>' +
        '<div class="msg-bot-content" id="' + contentId + '" style="display:none;"></div>' +
        '<div class="sse-meta" id="' + stageId + '_meta"></div>' +
      '</div>';
    chatBox.appendChild(row);
    scrollBottom();

    const stageEl = document.getElementById(stageId);
    const contentEl = document.getElementById(contentId);
    const metaEl = document.getElementById(stageId + '_meta');
    let fullText = '';
    let meta = {};

    function renderStage(stage) {
      const existing = stageEl.querySelector('[data-stage="' + stage.name + '"]');
      const statusIcon = stage.status === 'completed' ? '✓' : stage.status === 'running' ? '⟳' : '○';
      const cls = 'sse-stage-item ' + stage.status;
      if (existing) {
        existing.className = cls;
        existing.innerHTML = '<span class="stage-icon">' + statusIcon + '</span> ' + stage.label;
      } else {
        const el = document.createElement('div');
        el.className = cls;
        el.setAttribute('data-stage', stage.name);
        el.innerHTML = '<span class="stage-icon">' + statusIcon + '</span> ' + stage.label;
        stageEl.appendChild(el);
      }
    }

    try {
      const res = await fetch(API + '/chat/stream', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({
          question,
          ...scopeBody(),
          history: conversationHistory.slice(-10),
          user_id: 'web_user',
        })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let eventType = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // Parse SSE events from buffer
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line in buffer

        for (const line of lines) {
          if (line.startsWith('event: ')) {
            eventType = line.slice(7).trim();
          } else if (line.startsWith('data: ') && eventType) {
            try {
              const data = JSON.parse(line.slice(6));
              switch (eventType) {
                case 'stage':
                  renderStage(data);
                  break;
                case 'chunk':
                  fullText += data.text;
                  contentEl.style.display = '';
                  contentEl.innerHTML = renderMarkdown(fullText);
                  scrollBottom();
                  break;
                case 'sql':
                  meta.sql = data.sql;
                  break;
                case 'chart':
                  meta.chart = data;
                  break;
                case 'meta':
                  meta = { ...meta, ...data };
                  break;
                case 'done':
                  // Finalize
                  stageEl.style.display = 'none';
                  break;
                case 'error':
                  contentEl.style.display = '';
                  contentEl.innerHTML = '<span class="error-msg">' + escHtml(data.message) + '</span>';
                  break;
              }
            } catch (e) { /* skip malformed JSON */ }
            eventType = '';
          }
        }
      }

      // After stream completes: final re-render ensures complete markdown structure
      contentEl.innerHTML = renderMarkdown(fullText);

      // Render post-stream UI elements (chips, chart, SQL toggle)
      try {
        if (meta.suggestions && meta.suggestions.length > 0) {
          contentEl.insertAdjacentHTML('afterend', renderSuggestionChips(meta.suggestions));
        }
        if (meta.chart && contentEl.parentElement) {
          const ccId = 'ssecc_' + Date.now();
          const ccWrap = document.createElement('div');
          ccWrap.className = 'chat-chart-container';
          ccWrap.innerHTML = '<canvas id="' + ccId + '"></canvas>';
          contentEl.parentElement.appendChild(ccWrap);
          requestAnimationFrame(() => renderChatChart(ccId, meta.chart));
        }
        if (meta.sql) {
          const uid = 'ssesql_' + Date.now();
          const sqlHtml =
            '<button class="sql-toggle" onclick="toggleSql(\'' + uid + '\', this)" aria-expanded="false">' +
              '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>SQL' +
            '</button>' +
            '<div class="sql-block" id="' + uid + '">' +
              '<div class="sql-header"><span>SQL</span><button class="copy-btn" onclick="copySql(\'' + uid + '\')">نسخ</button></div>' +
              '<div class="sql-code">' + escHtml(meta.sql) + '</div>' +
            '</div>';
          contentEl.insertAdjacentHTML('afterend', sqlHtml);
        }
      } catch (postErr) {
        console.error('[SSE] post-stream render error:', postErr);
      }
      conversationHistory.push({ role: 'user', content: question });
      conversationHistory.push({ role: 'assistant', content: fullText });

    } catch (err) {
      // SSE Resilience: Immediate fallback to non-streaming /chat/ endpoint
      console.warn('[SSE] Stream failed, falling back to /chat/', err.message);
      stageEl.innerHTML = '<div class="sse-stage-item running"><span class="stage-icon">⟳</span> جاري المعالجة...</div>';
      try {
        const fallbackRes = await fetch(API + '/chat/', {
          method: 'POST',
          headers: apiHeaders(),
          body: JSON.stringify({
            question,
            ...scopeBody(),
            user_id: 'web_user',
            history: conversationHistory.slice(-10)
          })
        });
        const fallbackData = await fallbackRes.json();
        if (fallbackRes.ok && fallbackData.answer) {
          stageEl.style.display = 'none';
          contentEl.style.display = '';
          contentEl.innerHTML = renderMarkdown(fallbackData.answer);
          fullText = fallbackData.answer;
          meta = fallbackData;
          if (fallbackData.suggestions) {
            contentEl.insertAdjacentHTML('afterend', renderSuggestionChips(fallbackData.suggestions));
          }
          if (fallbackData.chart_data) {
            const fbCcId = 'fbcc_' + Date.now();
            const fbWrap = document.createElement('div');
            fbWrap.className = 'chat-chart-container';
            fbWrap.innerHTML = '<canvas id="' + fbCcId + '"></canvas>';
            contentEl.parentElement.appendChild(fbWrap);
            requestAnimationFrame(() => renderChatChart(fbCcId, fallbackData.chart_data));
          }
          conversationHistory.push({ role: 'user', content: question });
          conversationHistory.push({ role: 'assistant', content: fullText });
        } else {
          const errMsg = fallbackData.detail || 'حدث خطأ — حاول مرة أخرى';
          contentEl.style.display = '';
          contentEl.innerHTML = '<span class="error-msg">' + escHtml(errMsg) + '</span>';
          stageEl.style.display = 'none';
        }
      } catch (retryErr) {
        contentEl.style.display = '';
        contentEl.innerHTML = '<span class="error-msg">تعذّر الاتصال — تأكد من اتصال الإنترنت وحاول مرة أخرى</span>';
        stageEl.style.display = 'none';
      }
    } finally {
      isLoading = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('question-input').focus();
    }
  }

  function askQuestion(q) {
    document.getElementById('question-input').value = q;
    sendMessage();
  }

  // ══════════════════════════════════════════════════════════════
  // ERP OPERATOR: ACTION CARDS, NAVIGATION, EXPORT
  // ══════════════════════════════════════════════════════════════

  function renderActionCard(actionCard, method) {
    if (!actionCard) return '';
    const status = actionCard.status || '';
    const isResult = (status === 'completed' || status === 'failed' || status === 'rejected');

    if (isResult) {
      // Execution result card
      const statusClass = status === 'completed' ? 'success' : 'error';
      const statusIcon = status === 'completed' ? '&#10003;' : '&#10007;';
      const statusLabel = status === 'completed' ? 'تم التنفيذ' : status === 'failed' ? 'فشل' : 'مرفوض';
      let h = '<div class="action-card action-result ' + statusClass + '">';
      h += '<div class="action-result-header"><span class="action-status-icon">' + statusIcon + '</span> ' + statusLabel + '</div>';
      if (actionCard.action_type) {
        h += '<div class="action-detail"><span>النوع:</span> ' + escHtml(actionCard.action_type_label || actionCard.action_type) + '</div>';
      }
      if (actionCard.message) {
        h += '<div class="action-detail">' + escHtml(actionCard.message) + '</div>';
      }
      h += '</div>';
      return h;
    }

    // Confirmation card (pending action)
    let h = '<div class="action-card action-confirm">';
    h += '<div class="action-card-header">';
    h += '<span class="action-icon">&#9889;</span>';
    h += '<span class="action-title">' + escHtml(actionCard.action_type_label || 'إجراء') + '</span>';
    if (actionCard.risk_level) {
      const riskClass = actionCard.risk_level === 'high' ? 'risk-high' : actionCard.risk_level === 'medium' ? 'risk-medium' : 'risk-low';
      h += '<span class="action-risk ' + riskClass + '">' + escHtml(actionCard.risk_level) + '</span>';
    }
    h += '</div>';

    if (actionCard.description) {
      h += '<div class="action-desc">' + escHtml(actionCard.description) + '</div>';
    }

    // Parameters
    if (actionCard.params && Object.keys(actionCard.params).length > 0) {
      h += '<div class="action-params">';
      for (const [k, v] of Object.entries(actionCard.params)) {
        if (v) h += '<div class="action-param"><span>' + escHtml(k) + ':</span> ' + escHtml(String(v)) + '</div>';
      }
      h += '</div>';
    }

    // Warnings
    if (actionCard.warnings && actionCard.warnings.length > 0) {
      h += '<div class="action-warnings">';
      actionCard.warnings.forEach(w => {
        h += '<div class="action-warning">&#9888; ' + escHtml(w) + '</div>';
      });
      h += '</div>';
    }

    // Confirmation buttons
    h += '<div class="action-buttons">';
    h += '<button class="action-btn confirm" onclick="askQuestion(\'نعم\')">&#10003; تأكيد التنفيذ</button>';
    h += '<button class="action-btn cancel" onclick="askQuestion(\'لا\')">&#10007; إلغاء</button>';
    h += '</div>';
    h += '</div>';
    return h;
  }

  function renderNavLinks(navLinks) {
    if (!navLinks || navLinks.length === 0) return '';
    let h = '<div class="nav-links">';
    navLinks.forEach(page => {
      const icon = page.icon || 'file';
      h += '<a class="nav-link-card" href="' + escAttr(page.url || '#') + '" target="_blank" rel="noopener">';
      h += '<span class="nav-link-title">' + escHtml(page.title_ar || page.title_en || '') + '</span>';
      if (page.title_en) h += '<span class="nav-link-sub">' + escHtml(page.title_en) + '</span>';
      h += '</a>';
    });
    h += '</div>';
    return h;
  }

  function renderExportAvailable(exportInfo) {
    if (!exportInfo) return '';
    let h = '<div class="export-bar">';
    h += '<span class="export-msg">' + escHtml(exportInfo.message || 'يمكن تصدير النتائج') + '</span>';
    h += '<button class="export-btn" onclick="triggerExport(\'' + escAttr(exportInfo.format || 'excel') + '\')">تصدير ' + escHtml((exportInfo.format || 'excel').toUpperCase()) + '</button>';
    h += '</div>';
    return h;
  }

  function triggerExport(format) {
    // Trigger export by asking the assistant
    const formatLabels = { pdf: 'PDF', excel: 'Excel', csv: 'CSV', json: 'JSON' };
    askQuestion('صدّر النتائج ' + (formatLabels[format] || format));
  }

  // ══════════════════════════════════════════════════════════════
  // COPILOT: SUGGESTION CHIPS
  // ══════════════════════════════════════════════════════════════
  function renderSuggestionChips(suggestions) {
    if (!suggestions || suggestions.length === 0) return '';
    let html = '<div class="suggestion-chips">';
    suggestions.forEach(s => {
      const icon = CHIP_ICONS[s.icon] || CHIP_ICONS.suggest;
      html += '<button class="suggestion-chip" onclick="askQuestion(\'' + escAttr(s.query) + '\')">' +
        '<span class="chip-icon">' + icon + '</span>' +
        escHtml(s.label) +
      '</button>';
    });
    html += '</div>';
    return html;
  }

  // ══════════════════════════════════════════════════════════════
  // COPILOT: INSIGHT BLOCKS
  // ══════════════════════════════════════════════════════════════
  function renderInsights(insights) {
    if (!insights || insights.length === 0) return '';
    let html = '<div class="copilot-insights">';
    insights.forEach((ins, idx) => {
      if (!ins.text) return;
      const type = ins.type || 'neutral';
      const icon = INSIGHT_ICONS[ins.icon] || INSIGHT_ICONS.info;
      const delay = (idx * 0.12) + 0.1;
      html += '<div class="copilot-insight ' + type + '" style="animation-delay:' + delay + 's">' +
        '<span class="insight-icon">' + icon + '</span>' +
        '<span>' + escHtml(ins.text) + '</span>' +
      '</div>';
    });
    html += '</div>';
    return html;
  }

  // ══════════════════════════════════════════════════════════════
  // INLINE WIDGET RENDERING
  // ══════════════════════════════════════════════════════════════
  function renderInlineWidgets(widgets) {
    let html = '<div class="msg-widgets">';
    const charts = [];

    widgets.forEach((w, i) => {
      const sizeClass = 'w-' + (w.size || 'sm');
      const delay = 'animation-delay:' + (i * 0.08) + 's';

      if (w.error) {
        html += '<div class="' + sizeClass + ' inline-error widget-enter" style="' + delay + '">' +
          escHtml(w.title) + ': خطأ في التحميل</div>';
        return;
      }

      if (w.type === 'kpi') {
        html += renderInlineKpi(w, sizeClass, delay);
      } else if (['bar','line','pie','donut','doughnut','area'].includes(w.type)) {
        const canvasId = 'wc_' + w.id + '_' + Date.now() + '_' + i;
        html += renderInlineChartWidget(w, sizeClass, delay, canvasId);
        if (w.data) charts.push({ canvasId, data: w.data });
      } else if (w.type === 'table') {
        html += renderInlineTableWidget(w, sizeClass, delay);
      }
    });

    html += '</div>';
    return { html, charts };
  }

  function renderInlineKpi(w, sizeClass, delay) {
    const val = w.data?.value ?? 0;
    const fmt = w.data?.format || 'number';
    const icon = KPI_ICONS[w.icon] || KPI_ICONS.currency;

    let displayVal;
    if (fmt === 'currency') displayVal = formatCurrency(val);
    else if (fmt === 'percent') displayVal = val.toFixed(1) + '%';
    else displayVal = formatNumber(val);

    return '<div class="inline-kpi ' + sizeClass + ' widget-enter" style="' + delay + '">' +
      '<div class="inline-kpi-head">' +
        '<span class="inline-kpi-label">' + escHtml(w.title) + '</span>' +
        '<div class="inline-kpi-icon ' + (w.color || 'blue') + '">' + icon + '</div>' +
      '</div>' +
      '<div class="inline-kpi-value" data-kpi-target="' + val + '" data-kpi-fmt="' + fmt + '">' + displayVal + '</div>' +
      (w.description ? '<div class="inline-kpi-desc">' + escHtml(w.description) + '</div>' : '') +
    '</div>';
  }

  function renderInlineChartWidget(w, sizeClass, delay, canvasId) {
    return '<div class="inline-chart ' + sizeClass + ' widget-enter" style="' + delay + '">' +
      '<div class="inline-chart-title">' + escHtml(w.title) + '</div>' +

  // ══════════════════════════════════════════════════════════════
  // MARKDOWN RENDERER
  // ══════════════════════════════════════════════════════════════
  function renderMarkdown(text) {
    if (!text) return '';

    // Pre-process: extract fenced code blocks before line-by-line parsing
    const _codeBlocks = [];
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, function(match, lang, code) {
      const ph = '\x01CB' + _codeBlocks.length + '\x01';
      _codeBlocks.push({ lang: lang.trim(), code: code.trimEnd() });
      return ph;
    });

    const lines = text.split('\n');
    let html = '';
    let i = 0;
    let afterHr = false;

    while (i < lines.length) {
      const raw = lines[i];
      const line = raw.trim();

      if (!line) { i++; continue; }

      // Fenced code block placeholder
      if (line.startsWith('\x01CB') && line.endsWith('\x01')) {
        const idx = parseInt(line.slice(3, -1), 10);
        const cb = _codeBlocks[idx];
        if (cb) html += renderCodeBlock(cb.lang, cb.code);
        i++; afterHr = false; continue;
      }

      // Horizontal rule
      if (/^[-*_]{3,}$/.test(line)) {
        afterHr = true;
        html += '<hr class="md-hr">';
        i++; continue;
      }

      // H3 — checked before H2 to avoid prefix collision
      if (/^### /.test(line)) {
        const title = line.slice(4);
        if (/^(ملاحظات|ملاحظة|تنبيهات|توصيات)/.test(title)) {
          // Notes card: collect following list items
          i++;
          while (i < lines.length && !lines[i].trim()) i++;
          let preText = '';
          if (i < lines.length && lines[i].trim() && !/^\s*[-*]\s/.test(lines[i])) {
            preText = lines[i].trim(); i++;
            while (i < lines.length && !lines[i].trim()) i++;
          }
          const noteItems = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            noteItems.push(lines[i].trim().replace(/^[-*]\s+/, '')); i++;
          }
          html += renderNotesCard(title, preText, noteItems);
        } else if (/^(تحليل الهيكل|تحليل|تقييم)/.test(title)) {
          html += '<h4 class="md-h4 md-analysis-header">🌳 ' + escHtml(title) + '</h4>';
          i++;
        } else {
          html += '<h4 class="md-h4">' + inlineFmt(escHtml(title)) + '</h4>';
          i++;
        }
        afterHr = false; continue;
      }

      // H2
      if (/^## /.test(line)) {
        html += '<h3 class="md-h3">' + inlineFmt(escHtml(line.slice(3))) + '</h3>';
        i++; afterHr = false; continue;
      }

      // H1
      if (/^# /.test(line)) {
        html += '<h2 class="md-h1">' + inlineFmt(escHtml(line.slice(2))) + '</h2>';
        i++; afterHr = false; continue;
      }

      // Account tree (box-drawing characters)
      if (/[└├│┌]/.test(line)) {
        const treeLines = [];
        while (i < lines.length && lines[i].trim()) {
          treeLines.push(lines[i]); i++;
        }
        html += renderAccountTree(treeLines);
        afterHr = false; continue;
      }

      // Markdown table
      if (line.startsWith('|')) {
        const tLines = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          tLines.push(lines[i].trim()); i++;
        }
        html += renderMdTable(tLines);
        afterHr = false; continue;
      }

      // Financial KPI cards
      if (isKpiLine(line)) {
        const kpiLines = [line]; i++;
        while (i < lines.length && isKpiLine(lines[i].trim())) {
          kpiLines.push(lines[i].trim()); i++;
        }
        html += renderKpiCards(kpiLines);
        afterHr = false; continue;
      }

      // Unordered list
      if (/^[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items.push(lines[i].trim().replace(/^[-*]\s+/, '')); i++;
        }
        html += '<ul class="md-list">' + items.map(it => '<li>' + inlineFmt(escHtml(it)) + '</li>').join('') + '</ul>';
        afterHr = false; continue;
      }

      // Ordered list
      if (/^\d+[.)]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
          items.push(lines[i].trim().replace(/^\d+[.)]\s+/, '')); i++;
        }
        html += '<ol class="md-olist">' + items.map(it => '<li>' + inlineFmt(escHtml(it)) + '</li>').join('') + '</ol>';
        afterHr = false; continue;
      }

      // Key-value card
      if (isKvLine(line)) {
        const kvLines = [];
        while (i < lines.length && lines[i].trim() && isKvLine(lines[i].trim())) {
          kvLines.push(lines[i].trim()); i++;
        }
        if (kvLines.length >= 2) { html += renderMdCard(kvLines); afterHr = false; continue; }
        html += wrapParagraph(kvLines[0], afterHr);
        afterHr = false; continue;
      }

      // Regular paragraph
      html += wrapParagraph(line, afterHr);
      afterHr = false;
      i++;
    }

    return html;
  }

  function wrapParagraph(line, isSummary) {
    const cls = isSummary ? 'md-summary' : 'md-p';
    return '<p class="' + cls + '">' + inlineFmt(escHtml(line)) + '</p>';
  }

  function isKvLine(line) {
    if (!line || line.startsWith('|') || line.startsWith('#') || /^[-*]\s/.test(line) || /^\d+[.)]\s/.test(line)) return false;
    if (/^[-*_]{3,}$/.test(line)) return false;
    const idx = line.indexOf(':');
    if (idx <= 0 || idx >= line.length - 1) return false;
    const label = line.substring(0, idx).trim();
    return label.length > 0 && label.length < 35;
  }

  function renderMdCard(lines) {
    let h = '<div class="md-card">';
    for (const line of lines) {
      const idx = line.indexOf(':');
      const label = line.substring(0, idx).trim();
      const value = line.substring(idx + 1).trim();
      const isNumeric = /^[\d,.\-٠-٩٫٬\s%]+$/.test(value.replace(/[^\d,.\-%٠-٩٫٬\s]/g, ''));
      h += '<div class="md-card-field">' +
        '<span class="md-card-label">' + escHtml(label) + '</span>' +
        '<span class="md-card-value' + (isNumeric ? '' : ' text-val') + '">' + inlineFmt(escHtml(value)) + '</span>' +
      '</div>';
    }
    h += '</div>';
    return h;
  }

  function renderMdTable(tLines) {
    if (tLines.length < 2) return tLines.map(l => '<p class="md-p">' + escHtml(l) + '</p>').join('');
    const parseCells = row => row.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    const headers = parseCells(tLines[0]);
    let dataStart = 1;
    if (tLines.length > 1 && /^[\s|:-]+$/.test(tLines[1])) dataStart = 2;
    const rows = [];
    for (let j = dataStart; j < tLines.length; j++) {
      const cells = parseCells(tLines[j]);
      if (cells.length > 0 && cells.some(c => c)) rows.push(cells);
    }
    let h = '<div class="md-table-wrap"><table class="data-table"><thead><tr>';
    headers.forEach(hdr => { h += '<th>' + inlineFmt(escHtml(hdr)) + '</th>'; });
    h += '</tr></thead><tbody>';
    rows.forEach(row => {
      h += '<tr>';
      row.forEach(cell => {
        const isNum = /^[\d,.\-٫٬\s]+$/.test(cell) && cell.length > 0;
        h += '<td class="' + (isNum ? 'num' : '') + '">' + inlineFmt(escHtml(cell)) + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }

  function inlineFmt(text) {
    return text
      .replace(/`([^`\n]+)`/g, '<code class="md-inline-code">$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function renderCodeBlock(lang, code) {
    const langLabel = (lang || 'CODE').toUpperCase();
    const uid = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

      '</div>' +

  function renderNotesCard(title, preText, items) {
    const ICONS = { 'ملاحظات': '💡', 'ملاحظة': '💡', 'تنبيهات': '⚠️', 'توصيات': '✅' };
    const icon = Object.keys(ICONS).reduce((acc, k) => title.startsWith(k) ? ICONS[k] : acc, '📌');
    let h = '<div class="md-notes-card"><div class="md-notes-title">' + icon + ' ' + escHtml(title) + '</div>';
    if (preText) h += '<p class="md-p" style="margin:0 0 8px">' + inlineFmt(escHtml(preText)) + '</p>';
    if (items.length > 0) {
      h += '<ul class="md-list">' + items.map(it => '<li>' + inlineFmt(escHtml(it)) + '</li>').join('') + '</ul>';
    }
    h += '</div>';
    return h;
  }

  function renderAccountTree(lines) {
    let h = '<div class="md-tree">';
    lines.forEach(line => {
      const escaped = escHtml(line);
      const highlighted = escaped.replace(/(\b\d{1,10}\b)/g, '<span class="tree-node">$1</span>');
      h += '<div class="md-tree-line">' + highlighted + '</div>';
    });
    h += '</div>';
    return h;
  }

  const _KPI_DEFS = [
    { patterns: ['إجمالي المبيعات', 'مجموع المبيعات'], type: 'sales' },
    { patterns: ['إجمالي المشتريات', 'تكلفة المبيعات'], type: 'cost' },
    { patterns: ['صافي الربح', 'الربح الصافي', 'صافي الدخل'], type: 'profit' },
    { patterns: ['إجمالي الإيرادات', 'الإيرادات الإجمالية'], type: 'revenue' },
    { patterns: ['إجمالي المصروفات', 'المصروفات الإجمالية'], type: 'expense' },
  ];

  function isKpiLine(line) {
    if (!line || !/\*\*[\d,،.٠-٩]+\*\*/.test(line)) return false;
    return _KPI_DEFS.some(d => d.patterns.some(p => line.includes(p)));
  }

  function renderKpiCards(lines) {
    let h = '<div class="md-kpi-row">';
    lines.forEach(line => {
      const def = _KPI_DEFS.find(d => d.patterns.some(p => line.includes(p)));
      const type = def ? def.type : 'sales';
      const valMatch = line.match(/\*\*([\d,،.٠-٩]+)\*\*/);
      const val = valMatch ? valMatch[1] : '';
      const label = line.replace(/\*\*[\d,،.٠-٩]+\*\*[\s\S]*/, '').replace(/[*_]/g, '').replace(/[:—–]/g, '').trim();
      h += '<div class="md-kpi-card ' + type + '">' +
        '<div class="md-kpi-label">' + escHtml(label) + '</div>' +
        '<div class="md-kpi-val">' + escHtml(val) + '</div>' +
      '</div>';
    });
    h += '</div>';
    return h;
  }

  // ══════════════════════════════════════════════════════════════
  // CHART RENDERING — with instance tracking to prevent memory leaks
  // ══════════════════════════════════════════════════════════════
  const _chartInstances = {};  // canvasId -> Chart instance

  function initChartOnCanvas(canvasId, chartData) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !chartData) return;

    // Destroy previous Chart instance on same canvas (prevents memory leak)
    if (_chartInstances[canvasId]) {
      _chartInstances[canvasId].destroy();
      delete _chartInstances[canvasId];
    }

    const ctx = canvas.getContext('2d');
    const type = chartData.type === 'area' ? 'line' : (chartData.type || 'bar');

    const datasets = (chartData.datasets || []).map(ds => {
      const obj = {
        label: ds.label || '',
        data: ds.data || [],
        backgroundColor: ds.backgroundColor || ['oklch(0.52 0.20 260)'],
      };
      if (type === 'line') {
        obj.borderColor = ds.borderColor || 'oklch(0.52 0.20 260)';
        obj.borderWidth = 2.5;
        obj.tension = 0.35;
        obj.fill = chartData.type === 'area';
        obj.pointRadius = 4;
        obj.pointBackgroundColor = 'white';
        obj.pointBorderColor = ds.borderColor || 'oklch(0.52 0.20 260)';
        obj.pointBorderWidth = 2;
        obj.pointHoverRadius = 6;
      } else {
        obj.borderWidth = 0;
        obj.borderRadius = 6;
        obj.hoverBorderWidth = 2;
        obj.hoverBorderColor = 'oklch(0.30 0.15 260)';
      }
      return obj;
    });

    _chartInstances[canvasId] = new Chart(ctx, {
      type: type,
      data: { labels: chartData.labels || [], datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: ['pie','doughnut'].includes(type),
            position: 'bottom',
            rtl: true,
            labels: { font: { family: 'Segoe UI, SF Arabic, system-ui', size: 11 }, padding: 14 }
          },
          tooltip: {
            rtl: true,
            backgroundColor: 'oklch(0.20 0.020 260)',
            titleFont: { family: 'Segoe UI, SF Arabic', size: 12 },
            bodyFont: { family: 'Segoe UI, SF Arabic', size: 12 },
            padding: 12,
            cornerRadius: 8,
            displayColors: true,
            callbacks: {
              label: function(ctx) {
                const val = ctx.parsed.y !== undefined ? ctx.parsed.y : ctx.parsed;
                return ctx.dataset.label + ': ' + Number(val).toLocaleString();
              }
            }
          }
        },
        scales: !['pie','doughnut'].includes(type) ? {
          y: {
            beginAtZero: true,
            ticks: { callback: v => Number(v).toLocaleString(), font: { size: 11 } },
            grid: { color: 'oklch(0.93 0.004 250)', drawBorder: false }
          },
          x: {
            ticks: { font: { size: 11 }, maxRotation: 35 },
            grid: { display: false }
          }
        } : undefined,
        animation: { duration: 900, easing: 'easeOutQuart' }
      }
    });
  }

  function renderChatChart(canvasId, chartData) {
    initChartOnCanvas(canvasId, chartData);
  }

  // ══════════════════════════════════════════════════════════════
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function escAttr(s) {
    return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function scrollBottom() {
    const area = document.getElementById('chat-area');
    requestAnimationFrame(() => area.scrollTop = area.scrollHeight);
  }

  function formatNumber(n) {
    return Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function formatCurrency(n) {
    return Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  function animateKpiValue(el, end, fmt) {
    if (end === 0) return;
    const duration = 900;
    const startTime = performance.now();
    function step(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 4); // ease-out-quart
      const current = end * eased;
      if (fmt === 'currency') el.textContent = formatCurrency(current);
      else if (fmt === 'percent') el.textContent = current.toFixed(1) + '%';
      else el.textContent = formatNumber(current);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function exportTableCsv(tableEl, title) {
    if (!tableEl) return;
    const rows = tableEl.querySelectorAll('tr');
    let csv = '﻿';
    rows.forEach(row => {
      const cells = row.querySelectorAll('th, td');
      const line = Array.from(cells).map(c => '"' + c.textContent.replace(/"/g, '""') + '"').join(',');
      csv += line + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (title || 'table') + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('تم تصدير الجدول');
  }

  async function submitTraining() {
    const reportName  = document.getElementById('train-report-name').value.trim();
    const description = document.getElementById('train-description').value.trim();
    const sql         = document.getElementById('train-sql').value.trim();

    if (!reportName || !description || !sql) {
      showToast('يرجى ملء الحقول الثلاثة كاملة');
      return;
    }

    const btn     = document.getElementById('train-submit-btn');
    const spinner = document.getElementById('train-spinner');
    const label   = document.getElementById('train-submit-label');

    btn.disabled = true;
    spinner.style.display = 'block';
    label.textContent = 'جاري الحفظ...';

    try {
      const res = await fetch(`${API}/learning/train-from-query`, {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({ report_name: reportName, description, sql }),
      });
      const data = await res.json();
      if (res.ok && data.status === 'learned') {
        closeTrainModal();
        showToast(data.message || '✅ تم تدريب الـ AI على التقرير');
      } else if (data.status === 'rejected') {
        showToast(`❌ ${data.message}`);
      } else {
        showToast(`❌ ${data.detail || data.message || 'فشل الحفظ'}`);
      }
    } catch (err) {
      showToast('❌ خطأ في الاتصال بالسيرفر');
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      label.textContent = 'حفظ وتدريب ✓';
    }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  async function checkHealth() {
    const dot = document.getElementById('status-dot');
    const label = document.getElementById('status-label');
    try {
      const r = await fetch('/health');
      if (r.ok) { dot.style.background = 'var(--green)'; label.textContent = 'متصل'; }
      else throw 0;
    } catch {
      dot.style.background = 'var(--red)'; label.textContent = 'غير متصل';
    }
  }

  // ══════════════════════════════════════════════════════════════
  // PROACTIVE ALERT CENTER
  // ══════════════════════════════════════════════════════════════
  let alertPanelOpen = false;
  let cachedAlerts = [];

  function toggleAlertPanel() {
    const panel = document.getElementById('alert-panel');
    alertPanelOpen = !alertPanelOpen;
    panel.classList.toggle('open', alertPanelOpen);
    if (alertPanelOpen) refreshAlerts();
  }

  // Close panel on outside click
  document.addEventListener('click', (e) => {
    if (alertPanelOpen && !e.target.closest('.alert-bell')) {
      alertPanelOpen = false;
      document.getElementById('alert-panel').classList.remove('open');
    }
  });

  async function refreshAlerts() {
    try {
      const r = await fetch(API + '/chat/alerts', { headers: apiHeaders() });
      if (!r.ok) return;
      const data = await r.json();
      cachedAlerts = data.alerts || [];
      renderAlertPanel(cachedAlerts);
    } catch { /* silent */ }
  }

  async function pollAlertSummary() {
    try {
      const r = await fetch(API + '/chat/alerts/summary', { headers: apiHeaders() });
      if (!r.ok) return;
      const summary = await r.json();
      updateAlertBadge(summary);
    } catch { /* silent */ }
  }

  function updateAlertBadge(summary) {
    const bell = document.getElementById('alert-bell');
    const badge = document.getElementById('alert-badge');
    const unack = summary.unacknowledged || 0;
    const critical = summary.critical || 0;
    const total = summary.total || 0;

    badge.textContent = unack > 0 ? unack : '';
    badge.dataset.count = unack;

    bell.classList.toggle('has-alerts', total > 0);
    bell.classList.toggle('has-critical', critical > 0);
  }

  function renderAlertPanel(alerts) {
    const list = document.getElementById('alert-panel-list');
    if (!alerts || alerts.length === 0) {
      list.innerHTML = '<div class="alert-empty"><div class="alert-empty-icon">&#x2705;</div><div>لا توجد تنبيهات حالياً</div><div style="font-size:11px;color:var(--text-dim);margin-top:4px;">الوضع التشغيلي مستقر</div></div>';
      return;
    }

    let html = '';
    alerts.forEach(a => {
      const sevDot = '<div class="alert-severity-dot ' + a.severity + '"></div>';
      const timeAgo = formatTimeAgo(a.timestamp);
      html += '<div class="alert-item">' +
        sevDot +
        '<div class="alert-item-body">' +
          '<div class="alert-item-title">' + escHtml(a.title) + '</div>' +
          '<div class="alert-item-msg">' + escHtml(a.message) + '</div>' +
          (a.recommendation ? '<div class="alert-item-rec">' + escHtml(a.recommendation) + '</div>' : '') +
          '<div class="alert-item-meta">' +
            '<span>' + escHtml(a.severity_label) + '</span>' +
            '<span>' + escHtml(a.category_label) + '</span>' +
            '<span>' + timeAgo + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    });
    list.innerHTML = html;
  }

  function formatTimeAgo(ts) {
    const diff = Math.floor(Date.now() / 1000 - ts);
    if (diff < 60) return 'الآن';
    if (diff < 3600) return Math.floor(diff / 60) + ' دقيقة';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ساعة';
    return Math.floor(diff / 86400) + ' يوم';
  }

  async function acknowledgeAllAlerts() {
    try {
      await fetch(API + '/chat/alerts/acknowledge', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({})
      });
      await pollAlertSummary();
      showToast('تم تحديث التنبيهات');
    } catch { /* silent */ }
  }

  // Render proactive alerts in greeting response
  function renderProactiveAlerts(alerts) {
    if (!alerts || alerts.length === 0) return '';
    let html = '<div class="proactive-greeting-alerts">';
    html += '<div class="pa-title">&#x26A1; تنبيهات تحتاج اهتمامك</div>';
    alerts.forEach(a => {
      const icon = { critical: '&#x1F534;', warning: '&#x1F7E1;', info: '&#x1F535;', opportunity: '&#x1F7E2;' }[a.severity] || '&#x1F535;';
      html += '<div class="pa-item"><span>' + icon + '</span><span>' + escHtml(a.title) + ': ' + escHtml(a.message) + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  // ══════════════════════════════════════════════════════════════
  // INIT
  // ══════════════════════════════════════════════════════════════
  (function init() {
    checkHealth();
    setInterval(checkHealth, 30000);
    loadScopeDefaults();
    // Proactive alert polling
    pollAlertSummary();
    setInterval(pollAlertSummary, 60000);
    document.getElementById('question-input').focus();
  })();
</script>
</body>
</html>
