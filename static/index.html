<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JustClick AI Copilot — المستشار التنفيذي الذكي</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            oklch(0.965 0.005 250);
      --surface:       oklch(0.995 0.002 250);
      --surface2:      oklch(0.94 0.006 250);
      --border:        oklch(0.90 0.008 250);
      --border-strong: oklch(0.84 0.010 250);
      --accent:        oklch(0.52 0.20 260);
      --accent-soft:   oklch(0.52 0.20 260 / 0.08);
      --accent-hover:  oklch(0.47 0.22 260);
      --accent-glow:   oklch(0.52 0.20 260 / 0.15);
      --text:          oklch(0.16 0.012 250);
      --text-mid:      oklch(0.40 0.008 250);
      --text-dim:      oklch(0.55 0.007 250);
      --green:         oklch(0.58 0.16 155);
      --green-soft:    oklch(0.58 0.16 155 / 0.10);
      --red:           oklch(0.55 0.19 25);
      --red-soft:      oklch(0.55 0.19 25 / 0.08);
      --amber:         oklch(0.65 0.15 70);
      --amber-soft:    oklch(0.65 0.15 70 / 0.10);
      --purple:        oklch(0.52 0.16 310);
      --purple-soft:   oklch(0.52 0.16 310 / 0.10);
      --teal:          oklch(0.54 0.13 195);
      --teal-soft:     oklch(0.54 0.13 195 / 0.10);
      --radius:        10px;
      --radius-lg:     14px;
      --radius-xl:     18px;
      --shadow-sm:     0 1px 3px oklch(0 0 0 / 0.04);
      --shadow:        0 4px 16px oklch(0 0 0 / 0.06);
      --shadow-lg:     0 8px 32px oklch(0 0 0 / 0.08);
      --font:          "Segoe UI", "SF Arabic", system-ui, -apple-system, sans-serif;
      --mono:          "Cascadia Code", "Fira Code", "Consolas", monospace;
      --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ─────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      padding: 0 28px;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, oklch(0.52 0.20 260), oklch(0.45 0.22 280));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px oklch(0.52 0.20 260 / 0.25);
      transition: transform 0.3s var(--ease-out);
    }

    .brand-icon:hover { transform: scale(1.05); }
    .brand-icon svg { width: 20px; height: 20px; fill: white; }

    .brand-text { display: flex; flex-direction: column; gap: 1px; }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .header-end {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text-mid);
      border: 1px solid var(--border);
      transition: all 0.2s var(--ease-out);
    }

    .clear-memory-btn { cursor: pointer; }

    .clear-memory-btn:hover {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-soft);
    }

    .train-btn { cursor: pointer; }
    .train-btn:hover {
      border-color: oklch(0.62 0.15 155);
      color: oklch(0.62 0.15 155);
      background: oklch(0.62 0.15 155 / 0.1);
    }

    /* ── Training Modal ─────────────────────────────────────────── */
    #train-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      background: rgba(255,255,255,0.85);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #train-modal-overlay.open { display: flex; }
    .train-modal {
      background: var(--surface1);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 460px;
      max-width: calc(100vw - 32px);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      position: relative;
      z-index: 10000;
      direction: rtl;
    }
    .train-modal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .train-modal-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-hi);
      margin: 0;
      flex: 1;
    }
    .train-modal-close {
      background: none;
      border: none;
      color: var(--text-mid);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      font-size: 18px;
      line-height: 1;
      transition: color 0.15s;
    }
    .train-modal-close:hover { color: var(--text-hi); }
    .train-field { margin-bottom: 16px; }
    .train-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 6px;
    }
    .train-field label span { color: oklch(0.65 0.18 25); margin-right: 2px; }
    .train-field input,
    .train-field textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-hi);
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      resize: vertical;
    }
    .train-field input:focus,
    .train-field textarea:focus { border-color: oklch(0.62 0.15 155); }
    .train-field textarea {
      min-height: 90px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      direction: ltr;
      text-align: left;
    }
    .train-modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .train-submit-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 20px;
      background: oklch(0.62 0.15 155);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .train-submit-btn:hover { opacity: 0.88; }
    .train-submit-btn:disabled { opacity: 0.45; cursor: default; }
    .train-cancel-btn {
      padding: 9px 16px;
      background: transparent;
      color: var(--text-mid);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .train-cancel-btn:hover { border-color: var(--text-mid); }
    .train-spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: statusPulse 3s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { box-shadow: 0 0 6px var(--green); }
      50% { box-shadow: 0 0 12px var(--green), 0 0 4px var(--green); }
    }

    /* ── Chat area ──────────────────────────── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: oklch(0.85 0.005 250); border-radius: 3px; }

    /* ── Empty state (Copilot welcome) ─────── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 48px 24px;
      animation: fadeInUp 0.6s var(--ease-out) both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .copilot-avatar {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, oklch(0.52 0.20 260), oklch(0.45 0.22 280));
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px oklch(0.52 0.20 260 / 0.3);
      animation: float 4s ease-in-out infinite;
      position: relative;
    }

    .copilot-avatar::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 24px;
      background: linear-gradient(135deg, oklch(0.52 0.20 260 / 0.3), oklch(0.45 0.22 280 / 0.1));
      z-index: -1;
      animation: avatarGlow 4s ease-in-out infinite alternate;
    }

    @keyframes avatarGlow {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .copilot-avatar svg { width: 32px; height: 32px; fill: white; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .empty-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .empty-sub {
      font-size: 14.5px;
      color: var(--text-dim);
      max-width: 48ch;
      line-height: 1.7;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-mid);
      cursor: pointer;
      transition: all 0.25s var(--ease-out);
      position: relative;
      overflow: hidden;
    }

    .suggestion::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-soft), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .suggestion:hover::before { opacity: 1; }

    .suggestion:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .suggestion:active { transform: scale(0.97) translateY(0); }

    /* ── Messages ───────────────────────────── */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      animation: msgIn 0.45s var(--ease-out) both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-user {
      align-self: flex-start;
      background: oklch(0.92 0.035 260);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 16px 16px 4px 16px;
      max-width: 72%;
      font-size: 14.5px;
      line-height: 1.7;
      font-weight: 500;
      transition: box-shadow 0.2s ease;
    }

    .msg-user:hover { box-shadow: 0 2px 12px oklch(0.52 0.20 260 / 0.08); }

    .msg-bot {
      align-self: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px 24px;
      border-radius: 16px 16px 16px 4px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.8;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.3s ease;
    }

    .msg-bot:hover { box-shadow: var(--shadow); }

    .msg-bot.has-widgets {
      max-width: 96%;
      width: 96%;
    }

    .msg-bot-content { word-wrap: break-word; }
    .msg-bot-content p:first-child { margin-top: 0; }
    .msg-bot-content p:last-child { margin-bottom: 0; }

    /* Streaming text effect */
    .msg-bot-content.streaming .stream-word {
      opacity: 0;
      animation: wordReveal 0.15s ease forwards;
    }

    @keyframes wordReveal {
      from { opacity: 0; filter: blur(2px); }
      to { opacity: 1; filter: blur(0); }
    }

    /* ── SSE Streaming Stages ─────────────────── */
    .sse-stages {
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .sse-stage-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      transition: opacity 0.3s;
    }
    .sse-stage-item.completed { color: var(--accent); opacity: 0.7; }
    .sse-stage-item.running { color: var(--text); font-weight: 600; }
    .sse-stage-item .stage-icon { font-size: 0.75rem; width: 14px; text-align: center; }
    .sse-stage-item.running .stage-icon { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── Rendered markdown ──────────────────── */
    .md-p { margin: 6px 0; line-height: 1.85; }
    .md-p strong { color: var(--text); font-weight: 700; }

    .md-h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 16px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .md-h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin: 12px 0 6px;
    }

    .md-list {
      margin: 8px 0;
      padding-right: 6px;
      list-style: none;
    }

    .md-list li {
      position: relative;
      padding: 5px 20px 5px 0;
      line-height: 1.75;
      font-size: 13.5px;
    }

    .md-list li::before {
      content: '';
      position: absolute;
      right: 0;
      top: 14px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .md-olist {
      margin: 8px 0;
      padding-right: 6px;
      list-style: none;
      counter-reset: md-ol;
    }

    .md-olist li {
      position: relative;
      padding: 5px 30px 5px 0;
      line-height: 1.75;
      font-size: 13.5px;
      counter-increment: md-ol;
    }

    .md-olist li::before {
      content: counter(md-ol);
      position: absolute;
      right: 0;
      top: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .md-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 18px;
      margin: 12px 0;
    }

    .md-card-field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid oklch(0.94 0.004 250);
      gap: 12px;
    }

    .md-card-field:last-child { border-bottom: none; }

    .md-card-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-mid);
      flex-shrink: 0;
    }

    .md-card-value {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      text-align: left;
      direction: ltr;
    }

    .md-card-value.text-val {
      direction: rtl;
      text-align: right;
      font-weight: 600;
      color: var(--text);
    }

    .md-table-wrap {
      margin: 12px 0;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .md-hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 14px 0;
    }

    .md-summary {
      margin: 6px 0 0;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--accent-soft), oklch(0.52 0.16 310 / 0.05));
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.8;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }

    .md-summary::before {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }

    .msg-error {
      background: var(--red-soft);
      border: 1px solid oklch(0.55 0.19 25 / 0.12);
      color: var(--red);
      padding: 14px 20px;
      border-radius: var(--radius-lg);
      font-size: 13.5px;
    }

    /* ── Copilot Insight Blocks ────────────── */
    .copilot-insights {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 14px 0 6px;
    }

    .copilot-insight {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 15px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.7;
      animation: insightIn 0.45s var(--ease-out) both;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .copilot-insight:hover {
      transform: translateX(-2px);
      box-shadow: 0 2px 8px oklch(0 0 0 / 0.04);
    }

    .copilot-insight.positive {
      background: var(--green-soft);
      color: oklch(0.35 0.10 155);
    }

    .copilot-insight.warning {
      background: var(--amber-soft);
      color: oklch(0.35 0.12 70);
    }

    .copilot-insight.info {
      background: var(--accent-soft);
      color: oklch(0.35 0.12 260);
    }

    .copilot-insight.neutral {
      background: var(--surface2);
      color: var(--text-mid);
    }

    .insight-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    @keyframes insightIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ── ERP Operator: Action Cards ──────── */
    .action-card {
      margin-top: 14px;
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      animation: cardSlideIn 0.4s var(--ease-out) forwards;
    }
    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .action-confirm {
      background: oklch(0.97 0.015 260 / 0.6);
      border: 1.5px solid oklch(0.52 0.20 260 / 0.25);
    }
    .action-result.success {
      background: var(--green-soft);
      border: 1.5px solid oklch(0.58 0.16 155 / 0.3);
    }
    .action-result.error {
      background: var(--red-soft);
      border: 1.5px solid oklch(0.55 0.19 25 / 0.3);
    }
    .action-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .action-icon { font-size: 18px; }
    .action-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }
    .action-risk {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
    }
    .risk-high { background: var(--red-soft); color: var(--red); }
    .risk-medium { background: var(--amber-soft); color: var(--amber); }
    .risk-low { background: var(--green-soft); color: var(--green); }
    .action-desc {
      font-size: 13px;
      color: var(--text-mid);
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .action-params {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: var(--radius);
    }
    .action-param {
      font-size: 13px;
      color: var(--text);
    }
    .action-param span {
      color: var(--text-dim);
      font-weight: 500;
    }
    .action-warnings {
      margin-bottom: 12px;
    }
    .action-warning {
      font-size: 12px;
      color: var(--amber);
      padding: 4px 0;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .action-btn {
      padding: 8px 18px;
      border-radius: var(--radius);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.2s var(--ease-out);
    }
    .action-btn.confirm {
      background: var(--accent);
      color: white;
    }
    .action-btn.confirm:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .action-btn.cancel {
      background: var(--surface2);
      color: var(--text-mid);
      border: 1px solid var(--border);
    }
    .action-btn.cancel:hover {
      background: var(--red-soft);
      color: var(--red);
      border-color: oklch(0.55 0.19 25 / 0.3);
    }
    .action-result-header {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-status-icon { font-size: 16px; }
    .action-detail {
      font-size: 13px;
      color: var(--text-mid);
      margin-top: 4px;
    }

    /* ── ERP Operator: Navigation Links ──── */
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .nav-link-card {
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      transition: all 0.2s var(--ease-out);
      min-width: 120px;
    }
    .nav-link-card:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .nav-link-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .nav-link-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ── ERP Operator: Export Bar ────────── */
    .export-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--teal-soft);
      border: 1px solid oklch(0.54 0.13 195 / 0.2);
      border-radius: var(--radius);
    }
    .export-msg {
      font-size: 12px;
      color: var(--teal);
      flex: 1;
    }
    .export-btn {
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--teal);
      background: transparent;
      color: var(--teal);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.2s var(--ease-out);
    }
    .export-btn:hover {
      background: var(--teal);
      color: white;
    }

    /* ── Follow-up Suggestion Chips ───────── */
    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .suggestion-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid oklch(0.52 0.20 260 / 0.15);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.25s var(--ease-out);
      animation: chipIn 0.4s var(--ease-out) both;
      position: relative;
      overflow: hidden;
    }

    .suggestion-chip::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, oklch(0.52 0.20 260 / 0.08), transparent);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .suggestion-chip:hover::before { opacity: 1; }

    .suggestion-chip:nth-child(1) { animation-delay: 0.08s; }
    .suggestion-chip:nth-child(2) { animation-delay: 0.16s; }
    .suggestion-chip:nth-child(3) { animation-delay: 0.24s; }
    .suggestion-chip:nth-child(4) { animation-delay: 0.32s; }

    .suggestion-chip:hover {
      background: oklch(0.52 0.20 260 / 0.15);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .suggestion-chip:active { transform: scale(0.96) translateY(0); }

    .chip-icon { font-size: 14px; }

    @keyframes chipIn {
      from { opacity: 0; transform: translateY(8px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Message meta ───────────────────────── */
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .msg-time { font-size: 11px; color: var(--text-dim); }
    .msg-rows { font-size: 11px; font-weight: 600; color: var(--accent); }
    .msg-exec-time { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

    .method-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
      letter-spacing: 0.02em;
    }

    .method-badge.template   { background: var(--green-soft);  color: var(--green); }
    .method-badge.llm        { background: var(--accent-soft); color: var(--accent); }
    .method-badge.greeting,
    .method-badge.help       { background: var(--amber-soft);  color: var(--amber); }
    .method-badge.dashboard  { background: var(--teal-soft);   color: var(--teal); }
    .method-badge.action     { background: var(--purple-soft); color: var(--purple); }
    .method-badge.workflow   { background: var(--amber-soft);  color: var(--amber); }
    .method-badge.report     { background: var(--accent-soft); color: var(--accent); }
    .method-badge.navigation { background: var(--teal-soft);   color: var(--teal); }

    /* ── SQL toggle ─────────────────────────── */
    .sql-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: none;
      transition: all 0.15s ease;
    }

    .sql-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .sql-toggle svg { width: 14px; height: 14px; transition: transform 0.2s ease; }
    .sql-toggle.open svg { transform: rotate(90deg); }

    .sql-block {
      margin-top: 8px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .sql-block.open { max-height: 400px; overflow-y: auto; }

    .sql-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: oklch(0.22 0.020 260);
      color: oklch(0.75 0.010 250);
      border-radius: 8px 8px 0 0;
      font-size: 11px;
      font-weight: 600;
    }

    .copy-btn {
      background: none;
      border: 1px solid oklch(1 0 0 / 0.15);
      color: oklch(0.70 0.008 250);
      padding: 2px 10px;
      font-size: 11px;
      border-radius: 5px;
      cursor: pointer;
    }

    .copy-btn:hover { background: oklch(1 0 0 / 0.08); }

    .sql-code {
      background: oklch(0.18 0.018 260);
      color: oklch(0.82 0.010 250);
      padding: 14px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.65;
      border-radius: 0 0 8px 8px;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* ── Standalone chat chart ──────────────── */
    .chat-chart-container {
      margin: 12px 0 6px;
      max-height: 300px;
      border-radius: 10px;
      background: oklch(0.985 0.002 250);
      padding: 14px;
      border: 1px solid var(--border);
      animation: chartReveal 0.5s var(--ease-out) both;
      animation-delay: 0.2s;
    }

    @keyframes chartReveal {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ── Inline widgets ────────────────────── */
    .msg-widgets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 16px 0 10px;
    }

    .msg-widgets .w-sm { grid-column: span 1; }
    .msg-widgets .w-md { grid-column: span 2; }
    .msg-widgets .w-lg { grid-column: span 4; }

    .inline-kpi {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.25s var(--ease-out);
    }

    .inline-kpi:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px);
      border-color: var(--border-strong);
    }

    .inline-kpi-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .inline-kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .inline-kpi-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .inline-kpi-icon svg { width: 18px; height: 18px; }
    .inline-kpi-icon.blue   { background: var(--accent-soft); color: var(--accent); }
    .inline-kpi-icon.green  { background: var(--green-soft);  color: var(--green); }
    .inline-kpi-icon.red    { background: var(--red-soft);    color: var(--red); }
    .inline-kpi-icon.amber  { background: var(--amber-soft);  color: var(--amber); }
    .inline-kpi-icon.purple { background: var(--purple-soft); color: var(--purple); }
    .inline-kpi-icon.teal   { background: var(--teal-soft);   color: var(--teal); }

    .inline-kpi-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.1;
    }

    .inline-kpi-desc {
      font-size: 11px;
      color: var(--text-dim);
    }

    .inline-chart {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: all 0.25s var(--ease-out);
    }

    .inline-chart:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

    .inline-chart-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .inline-chart-wrap {
      min-height: 200px;
      max-height: 280px;
      position: relative;
    }

    .inline-chart-wrap canvas { width: 100% !important; height: 100% !important; }

    .inline-table {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      overflow: hidden;
      transition: all 0.25s var(--ease-out);
    }

    .inline-table:hover { box-shadow: var(--shadow); }

    .inline-table-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .inline-table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .data-table th {
      background: var(--surface2);
      font-weight: 700;
      font-size: 11.5px;
      color: var(--text-mid);
      padding: 9px 14px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 8px 14px;
      border-bottom: 1px solid oklch(0.94 0.004 250);
      white-space: nowrap;
      color: var(--text);
    }

    .data-table tbody tr:nth-child(even) td { background: oklch(0.975 0.003 250); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: oklch(0.95 0.008 260); }

    .data-table td.num {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      direction: ltr;
      text-align: left;
    }

    .inline-error {
      background: var(--red-soft);
      border: 1px solid oklch(0.55 0.19 25 / 0.12);
      border-radius: var(--radius);
      padding: 14px;
      color: var(--red);
      font-size: 12px;
      text-align: center;
    }

    .csv-export-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      margin-top: 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .csv-export-btn:hover {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-soft);
    }

    .csv-export-btn svg { width: 12px; height: 12px; }

    /* ── Input area ─────────────────────────── */
    .input-area {
      padding: 16px 28px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 10px 16px;
      transition: all 0.25s var(--ease-out);
      max-width: 880px;
      margin: 0 auto;
    }

    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft), 0 4px 20px oklch(0.52 0.20 260 / 0.06);
    }

    .input-row textarea {
      flex: 1;
      border: none;
      background: none;
      font-family: var(--font);
      font-size: 14.5px;
      resize: none;
      line-height: 1.5;
      color: var(--text);
      outline: none;
      max-height: 120px;
      min-height: 22px;
    }

    .input-row textarea::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border: none;
      border-radius: 12px;
      color: oklch(0.98 0 0);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s var(--ease-out);
      box-shadow: 0 2px 8px oklch(0.52 0.20 260 / 0.25);
    }

    .send-btn:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 4px 20px oklch(0.52 0.20 260 / 0.35); }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
    .send-btn svg { width: 20px; height: 20px; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
    }

    /* ── Loading (Copilot thinking) ────────── */
    .loading-indicator {
      align-self: flex-end;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      animation: msgIn 0.3s var(--ease-out) both;
    }

    .loading-avatar {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, oklch(0.52 0.20 260), oklch(0.45 0.22 280));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: thinkPulse 1.5s ease-in-out infinite;
    }

    .loading-avatar svg { width: 14px; height: 14px; fill: white; }

    @keyframes thinkPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .loading-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-mid);
    }

    .loading-sub {
      font-size: 11px;
      color: var(--text-dim);
      animation: loadingPhase 4s ease-in-out infinite;
    }

    @keyframes loadingPhase {
      0%, 25% { content: "يقرأ السياق..."; }
      25%, 50% { opacity: 0.7; }
      50%, 75% { opacity: 1; }
      75%, 100% { opacity: 0.7; }
    }

    .loading-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .loading-dots span {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.75); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    /* ── Toast ──────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: oklch(0.20 0.020 260);
      color: oklch(0.92 0.005 250);
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.35s var(--ease-out);
      z-index: 100;
      box-shadow: var(--shadow-lg);
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Widget enter animation ─────────────── */
    .widget-enter {
      opacity: 0;
      transform: translateY(10px);
      animation: widgetIn 0.5s var(--ease-out) forwards;
    }

    @keyframes widgetIn { to { opacity: 1; transform: translateY(0); } }

    /* ── Responsive ─────────────────────────── */
    @media (max-width: 768px) {
      .chat-area { padding: 16px; }
      .msg-user { max-width: 90%; }
      .msg-bot { max-width: 95%; padding: 16px 18px; }
      .msg-bot.has-widgets { max-width: 100%; width: 100%; }
      .msg-widgets { grid-template-columns: repeat(2, 1fr); }
      .msg-widgets .w-md { grid-column: span 2; }
      .msg-widgets .w-lg { grid-column: span 2; }
      .input-area { padding: 10px 12px 8px; }
      .suggestion-chips { gap: 6px; }
      .suggestion-chip { padding: 7px 12px; font-size: 12px; }
    }

    @media (max-width: 480px) {
      .msg-widgets { grid-template-columns: 1fr; }
      .msg-widgets .w-sm,
      .msg-widgets .w-md,
      .msg-widgets .w-lg { grid-column: span 1; }
      .inline-kpi-value { font-size: 22px; }
      .empty-title { font-size: 18px; }
    }

    /* ── Alert Center ──────────────────────── */
    .alert-bell {
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      transition: all 0.25s var(--ease-out);
      flex-shrink: 0;
    }

    .alert-bell:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .alert-bell svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-mid);
      fill: none;
      stroke-width: 2;
      transition: stroke 0.2s ease;
    }

    .alert-bell:hover svg { stroke: var(--accent); }

    .alert-bell.has-alerts svg {
      stroke: var(--amber);
      animation: bellRing 2s ease-in-out infinite;
    }

    .alert-bell.has-critical svg { stroke: var(--red); }

    @keyframes bellRing {
      0%, 80%, 100% { transform: rotate(0); }
      5%, 15% { transform: rotate(8deg); }
      10%, 20% { transform: rotate(-8deg); }
    }

    .alert-badge {
      position: absolute;
      top: -4px;
      left: -4px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: var(--red);
      color: white;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      box-shadow: 0 2px 8px oklch(0.55 0.19 25 / 0.4);
      animation: badgePop 0.3s var(--ease-spring) both;
    }

    @keyframes badgePop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .alert-badge:empty, .alert-badge[data-count="0"] { display: none; }

    /* Alert dropdown panel */
    .alert-panel {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 380px;
      max-height: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 1000;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
    }

    .alert-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .alert-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .alert-panel-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .alert-panel-actions {
      display: flex;
      gap: 8px;
    }

    .alert-panel-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-mid);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .alert-panel-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .alert-panel-list {
      overflow-y: auto;
      max-height: 380px;
      padding: 8px 0;
    }

    .alert-panel-list::-webkit-scrollbar { width: 5px; }
    .alert-panel-list::-webkit-scrollbar-thumb { background: oklch(0.85 0.005 250); border-radius: 3px; }

    .alert-item {
      display: flex;
      gap: 12px;
      padding: 12px 18px;
      transition: background 0.15s ease;
      cursor: default;
    }

    .alert-item:hover { background: var(--surface2); }

    .alert-item + .alert-item { border-top: 1px solid oklch(0.94 0.004 250); }

    .alert-severity-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .alert-severity-dot.critical { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .alert-severity-dot.warning { background: var(--amber); box-shadow: 0 0 8px oklch(0.65 0.15 70 / 0.4); }
    .alert-severity-dot.info { background: var(--accent); }
    .alert-severity-dot.opportunity { background: var(--green); box-shadow: 0 0 8px oklch(0.58 0.16 155 / 0.4); }

    .alert-item-body { flex: 1; min-width: 0; }

    .alert-item-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }

    .alert-item-msg {
      font-size: 12px;
      color: var(--text-mid);
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .alert-item-rec {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }

    .alert-item-meta {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
      display: flex;
      gap: 8px;
    }

    .alert-empty {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-dim);
      font-size: 13px;
    }

    .alert-empty-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    /* Proactive alerts in greeting */
    .proactive-greeting-alerts {
      margin-top: 16px;
      padding: 14px 18px;
      background: var(--amber-soft);
      border: 1px solid oklch(0.65 0.15 70 / 0.25);
      border-radius: var(--radius);
    }

    .proactive-greeting-alerts .pa-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .proactive-greeting-alerts .pa-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 4px 0;
      font-size: 12.5px;
      color: var(--text-mid);
      line-height: 1.5;
    }

    /* ── Markdown: H1 ─────────────────── */
    .md-h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin: 18px 0 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent);
      letter-spacing: -0.02em;
    }

    /* ── Markdown: Code blocks ─────────── */
    .md-code-block {
      margin: 12px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .md-code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      background: oklch(0.22 0.020 260);
      color: oklch(0.75 0.010 250);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
    }
    .md-code-copy-btn {
      background: none;
      border: 1px solid oklch(1 0 0 / 0.15);
      color: oklch(0.70 0.008 250);
      padding: 2px 10px;
      font-size: 11px;
      border-radius: 5px;
      cursor: pointer;
      font-family: var(--font);
    }
    .md-code-copy-btn:hover { background: oklch(1 0 0 / 0.08); }
    .md-code-pre {
      background: oklch(0.18 0.018 260);
      color: oklch(0.82 0.010 250);
      padding: 14px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.65;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
      overflow-x: auto;
    }
    .md-inline-code {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--accent);
    }

    /* ── Markdown: Notes card ─────────── */
    .md-notes-card {
      background: linear-gradient(135deg, oklch(0.52 0.20 260 / 0.07), oklch(0.52 0.16 310 / 0.04));
      border: 1px solid oklch(0.52 0.20 260 / 0.18);
      border-right: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 14px 18px 10px;
      margin: 12px 0;
    }
    .md-notes-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .md-notes-card .md-list { margin: 4px 0 0; }
    .md-notes-card .md-list li::before { background: var(--accent); }

    /* ── Markdown: Account tree ────────── */
    .md-tree {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-right: 3px solid var(--teal);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin: 12px 0;
      font-family: var(--mono);
      font-size: 13.5px;
      line-height: 2;
      direction: ltr;
      text-align: left;
      color: var(--text);
      overflow-x: auto;
    }
    .md-tree-line { white-space: pre; }
    .tree-node { color: var(--accent); font-weight: 700; }

    /* ── Markdown: KPI cards from text ─── */
    .md-kpi-row {
      display: flex;
      gap: 10px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    .md-kpi-card {
      flex: 1;
      min-width: 130px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-top: 3px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: box-shadow 0.2s ease;
    }
    .md-kpi-card:hover { box-shadow: var(--shadow); }
    .md-kpi-card.sales   { border-top-color: var(--green); }
    .md-kpi-card.cost    { border-top-color: var(--amber); }
    .md-kpi-card.profit  { border-top-color: var(--accent); }
    .md-kpi-card.revenue { border-top-color: var(--teal); }
    .md-kpi-card.expense { border-top-color: var(--red); }
    .md-kpi-label { font-size: 12px; color: var(--text-dim); font-weight: 600; }
    .md-kpi-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }
    .md-analysis-header { color: var(--teal); }
  </style>
</head>

          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
